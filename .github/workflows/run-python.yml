
name: Run unenroll.py

on:
  workflow_dispatch:
    inputs:
      serial_number:
        description: "Serial number"
        required: true
        type: string

      oauth_code:
        description: "OAuth code"
        required: true
        type: string

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests protobuf

      - name: Run unenroll.py
        env:
          SERIAL_NUMBER: ${{ inputs.serial_number }}
          OAUTH_CODE: ${{ inputs.oauth_code }}
        run: python unenroll.py
